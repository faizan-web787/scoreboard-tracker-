```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    text-align: center;
    padding: 20px;
    margin: 0;
}

.container {
    max-width: 500px;
    margin: 20px auto;
    background: #1e293b;
    padding: 24px;
    border-radius: 18px;
}

h1 {
    color: #38bdf8;
}

.teams {
    display: flex;
    gap: 12px;
}

.team {
    flex: 1;
    background: #334155;
    padding: 15px;
    border-radius: 12px;
}

input {
    width: 100%;
    padding: 10px;
    border-radius: 7px;
    border: none;
    margin: 8px 0;
    text-align: center;
}

.score {
    font-size: 48px;
    font-weight: bold;
    margin: 15px 0;
}

button {
    padding: 12px;
    margin: 4px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.add {
    background: #22c55e;
    color: #052e16;
}

.minus {
    background: #fbbf24;
    color: #422006;
}

.reset {
    background: #ef4444;
    color: white;
    margin-top: 20px;
}

#status {
    color: #7dd3fc;
    margin-top: 16px;
}
</style>
</head>

<body>

<div class="container">
    <h1>🏆 Scoreboard Tracker</h1>
    <p>Track your game scores!</p>

    <div class="teams">
        <div class="team">
            <input id="name1" value="Team A" aria-label="Team A name">
            <div class="score" id="score1">0</div>
            <button class="add" onclick="changeScore(1, 1)">+1</button>
            <button class="add" onclick="changeScore(1, 2)">+2</button>
            <button class="add" onclick="changeScore(1, 3)">+3</button>
            <button class="minus" onclick="changeScore(1, -1)">−1</button>
        </div>

        <div class="team">
            <input id="name2" value="Team B" aria-label="Team B name">
            <div class="score" id="score2">0</div>
            <button class="add" onclick="changeScore(2, 1)">+1</button>
            <button class="add" onclick="changeScore(2, 2)">+2</button>
            <button class="add" onclick="changeScore(2, 3)">+3</button>
            <button class="minus" onclick="changeScore(2, -1)">−1</button>
        </div>
    </div>

    <h2 id="winner">Match in progress</h2>

    <button class="reset" onclick="resetScores()">🔄 Reset Match</button>

    <p id="status">Ready to play!</p>
</div>

<script>
let scores = [0, 0];

function changeScore(team, points) {
    scores[team - 1] = Math.max(0, scores[team - 1] + points);

    document.getElementById("score" + team).textContent =
        scores[team - 1];

    updateWinner();
}

function updateWinner() {
    const winner = document.getElementById("winner");

    if (scores[0] > scores[1]) {
        winner.textContent = document.getElementById("name1").value + " is leading!";
    } else if (scores[1] > scores[0]) {
        winner.textContent = document.getElementById("name2").value + " is leading!";
    } else {
        winner.textContent = "It's a tie!";
    }

    document.getElementById("status").textContent = "Scores updated!";
}

function resetScores() {
    scores = [0, 0];

    document.getElementById("score1").textContent = "0";
    document.getElementById("score2").textContent = "0";
    document.getElementById("winner").textContent = "Match in progress";
    document.getElementById("status").textContent = "New match started!";
}
</script>

</body>
</html>
